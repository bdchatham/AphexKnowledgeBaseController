apiVersion: v1
kind: ServiceAccount
metadata:
  name: knowledgebase-controller
  namespace: platform-system
  labels:
    app: knowledgebase-controller
    app.kubernetes.io/name: knowledgebase-controller
    app.kubernetes.io/component: controller
    app.kubernetes.io/part-of: aphex-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: knowledgebase-controller
rules:
  - apiGroups:
      - aphex.io
    resources:
      - knowledgebases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - aphex.io
    resources:
      - knowledgebases/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - aphex.io
    resources:
      - knowledgebases/finalizers
    verbs:
      - update
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - watch
      - create
      - delete
  - apiGroups:
      - ""
    resources:
      - services
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - external-secrets.io
    resources:
      - externalsecrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - aphex.io
    resources:
      - organizations
    verbs:
      - get
      - list
  - apiGroups:
      - triggers.tekton.dev
    resources:
      - triggers
      - triggertemplates
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - triggers.tekton.dev
    resources:
      - triggerbindings
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: knowledgebase-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: knowledgebase-controller
subjects:
  - kind: ServiceAccount
    name: knowledgebase-controller
    namespace: platform-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: knowledgebase-trigger-manager
rules:
  - apiGroups: ["triggers.tekton.dev"]
    resources: ["triggers", "triggertemplates"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["triggers.tekton.dev"]
    resources: ["triggerbindings"]
    verbs: ["get", "list"]
