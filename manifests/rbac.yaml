apiVersion: v1
kind: ServiceAccount
metadata:
  name: knowledgebase-controller
  namespace: platform-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: knowledgebase-controller
rules:
  - apiGroups:
      - aphex.io
    resources:
      - knowledgebases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - aphex.io
    resources:
      - knowledgebases/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - aphex.io
    resources:
      - knowledgebases/finalizers
    verbs:
      - update
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - services
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: knowledgebase-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: knowledgebase-controller
subjects:
  - kind: ServiceAccount
    name: knowledgebase-controller
    namespace: platform-system
